else{let L={all:D,home:D,gems:D.filter(gem),long:D.filter(long),recent:D.slice(),liked:LS("liked").map(b=>BY[b]).filter(Boolean),later:LS("later").map(b=>BY[b]).filter(Boolean),hist:LS("hist").map(b=>BY[b]).filter(Boolean)}[st.view];
const R=apply(L);
const title=(VIEWS.find(v=>v[0]==st.view)||[,""])[1].replace(/^\S+ /,"")+(st.cat?" · "+st.cat:"")+(st.type?" · "+st.type:"")+(q?` · 搜索「${esc(q)}」`:"");
h=`<h2>${title}<small>${R.length} 个视频</small></h2>`+filters()+(R.length?`<div class="grid">${R.map(card).join("")}</div>`:`<div class="empty">没有匹配的视频</div>`)}
$("#main").innerHTML=h;bind()}
function toggle(k,bv){let a=LS(k);a=a.includes(bv)?a.filter(x=>x!=bv):[bv,...a];SV(k,a)}
function open_(bv){const x=BY[bv];let hs=LS("hist").filter(b=>b!=bv);SV("hist",[bv,...hs].slice(0,200));
const rel=D.filter(y=>y.bv!=bv).map(y=>[y,y.tags.filter(t=>x.tags.includes(t)).length*3+(y.cat==x.cat)+(y.up==x.up)*2]).filter(a=>a[1]>1).sort((a,b)=>b[1]-a[1]||b[0].n-a[0].n).slice(0,10).map(a=>a[0]);
const rc=x.men.filter(m=>m.ok),oth=x.men.filter(m=>!m.ok);const mn=m=>`<div class="mn"><div class="h"><b>@${esc(m.u)}</b> · ${m.mon} · 在「${esc(m.title)}」<span class="st ${m.ok?"r":""}">${m.s}</span><a class="go" href="https://www.v2ex.com/t/${m.tid}" target="_blank">去 V2EX 看 ↗</a></div><div>${esc(m.text)}</div></div>`;
const btn=(k,a,b)=>`<button class="ib" data-tg="${k}">${LS(k).includes(bv)?b:a}</button>`;
$("#dlg").innerHTML=`<div><span class="x" id="cls">×</span><div class="pl"><iframe src="https://player.bilibili.com/player.html?bvid=${bv}&autoplay=0&high_quality=1" allowfullscreen allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
<div class="dt">${esc(x.t)}</div><div class="cm">${esc(x.up)} · ${x.n} 位 V2EX 网友推荐 · 在 ${x.months} 个月份被推荐（${x.first} ~ ${x.last}）</div>
<div class="fl" style="margin-top:10px">${btn("liked","🤍 喜欢","❤️ 已喜欢")}${btn("later","🕒 稍后再看","✅ 已加入稍后看")}<a class="ib" href="https://www.bilibili.com/video/${bv}" target="_blank">去 B 站看 ↗</a></div>
<div class="info"><div class="cm">${fv(x.view)} 播放 · ${yr(x.pub)} 年发布 · 时长 ${fd(x.d)} · ${x.cat} · ${esc(x.type)}${x.ever?" · 常青":""}</div><p>${esc(x.sum)}</p>${x.why?`<p><b>V2EX 网友为什么推荐：</b>${esc(x.why)}</p>`:""}${x.quote?`<div class="q">“${esc(x.quote)}”</div>`:""}${x.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>
<h2>V2EX 上的 ${rc.length} 条推荐</h2>${rc.map(mn).join("")}${oth.length?`<details><summary class="cm">另有 ${oth.length} 条非推荐提及</summary>${oth.map(mn).join("")}</details>`:""}</div>
<div class="rel"><h2>相关推荐</h2>${rel.map(card).join("")||'<div class="cm">暂无</div>'}</div>`;
$("#ov").classList.add("on");$("#cls").onclick=close_;$("#dlg").querySelectorAll("[data-bv]").forEach(e=>e.onclick=()=>open_(e.dataset.bv));
$("#dlg").querySelectorAll("[data-tg]").forEach(e=>e.onclick=()=>{toggle(e.dataset.tg,bv);open_(bv)});$("#ov").scrollTop=0;history.replaceState(null,"","#"+bv)}
function close_(){$("#ov").classList.remove("on");$("#dlg").innerHTML="";history.replaceState(null,"",location.pathname);draw()}
$("#ov").onclick=e=>{if(e.target.id=="ov")close_()};
$("#q").oninput=()=>{if(st.view=="home"||["about","liked","later","hist"].includes(st.view))st.view=$("#q").value.trim()?"all":"home";draw()};
$("#rnd").onclick=()=>open_(D[Math.random()*D.length|0].bv);
$("#dk").onclick=()=>{document.documentElement.classList.toggle("dark");localStorage.setItem("v2t_dark",document.documentElement.classList.contains("dark")?1:0)};
if(localStorage.getItem("v2t_dark")=="1")document.documentElement.classList.add("dark");
document.addEventListener("keydown",e=>{if(e.key=="/"&&document.activeElement!=$("#q")){e.preventDefault();$("#q").focus()}if(e.key=="Escape")close_();if(e.key=="r"&&document.activeElement!=$("#q"))$("#rnd").click()});
draw();if(location.hash&&BY[location.hash.slice(1)])open_(location.hash.slice(1));
</script></body></html>
