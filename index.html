.hv{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:12px;padding:30px 10px 8px;opacity:0;transition:.2s}.card:hover .hv{opacity:1}

.cm{color:var(--mut);font-size:12px;margin-top:2px}

.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 8px;margin:4px 4px 0 0;font-size:12px}
.q{border-left:3px solid var(--acc);padding:2px 10px;margin:8px 0;color:var(--mut)}
.mn{border-top:1px solid var(--line);padding:10px 0}.mn .h{font-size:12px;color:var(--mut)}.st{font-size:11px;padding:0 6px;border-radius:8px;margin-left:6px;background:var(--bg2)}.st.r{background:#e6f7ee;color:#18834a}
